# Example values for a local k3d deployment.
#
# Copy this to k3d/values.local.yaml (git-ignored) and fill in real API keys.
# The image repository points at the in-cluster k3d registry created by
# k3d/cluster.yaml (see the Makefile `k3d-up` / `k3d-deploy` targets).
image:
  repository: firesearch-registry:5000/firesearch
  tag: local
  pullPolicy: Always

secrets:
  openaiApiKey: "REPLACE_ME"
  # Point at any OpenAI-compatible endpoint, or leave empty for OpenAI's default.
  openaiBaseUrl: ""
  firecrawlApiKey: "REPLACE_ME"

ingress:
  enabled: true
  className: traefik
  hosts:
    - host: firesearch.localhost
      paths:
        - path: /
          pathType: Prefix
