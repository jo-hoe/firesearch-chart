# k3d cluster definition for local end-to-end testing of the firecrawl-mcp chart.
# Create with:  k3d cluster create --config k3d/cluster.yaml
#
# All components use official ghcr.io/firecrawl/* images pulled from the
# internet, so no local registry is needed.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: firesearch
servers: 1
agents: 1
ports:
  # Expose the cluster's Traefik ingress on localhost:8080 so the MCP endpoint
  # is reachable at http://<mcp-host>:8080/v2/mcp.
  - port: 8080:80
    nodeFilters:
      - loadbalancer
