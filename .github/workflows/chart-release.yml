name: Release Chart

# Packages the Helm chart and pushes it as an OCI artifact to GitHub Container
# Registry (ghcr.io) on every version tag. No gh-pages branch is used.
#
# Consume the published chart with:
#   helm install firecrawl oci://ghcr.io/jo-hoe/charts/firecrawl-mcp --version <x.y.z>
on:
  push:
    tags:
      - 'v*.*.*'

# Serialize releases so concurrent tag pushes don't race.
concurrency:
  group: chart-release
  cancel-in-progress: false

env:
  # OCI registry namespace the chart is pushed to (chart name is appended).
  CHART_REGISTRY: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  release:
    name: Package & Push Chart (OCI)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Lint chart
        run: helm lint charts/firecrawl-mcp --strict

      - name: Verify helm-docs are up to date
        # Regenerate the chart README with the same tool `make generate-helm-docs`
        # uses, and fail if it differs from what's committed — so a published
        # chart never ships stale docs. Run `make generate-helm-docs` and commit
        # the result to fix a failure here.
        run: |
          docker run --rm --volume "$PWD/charts/firecrawl-mcp:/helm-docs" jnorwood/helm-docs:latest
          if ! git diff --exit-code -- charts/firecrawl-mcp/README.md; then
            echo "::error::charts/firecrawl-mcp/README.md is out of date. Run 'make generate-helm-docs' and commit the result." >&2
            exit 1
          fi

      - name: Log in to GHCR (Helm registry)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Package chart
        run: helm package charts/firecrawl-mcp --destination ./.cr-release-packages

      - name: Push chart to GHCR
        run: |
          for pkg in ./.cr-release-packages/*.tgz; do
            echo "Pushing $pkg to ${CHART_REGISTRY}"
            helm push "$pkg" "${CHART_REGISTRY}"
          done
