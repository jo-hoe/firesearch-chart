name: Release Chart

# Packages the Helm chart and pushes it as an OCI artifact to GitHub Container
# Registry (ghcr.io) on every version tag. No gh-pages branch is used.
#
# Consume the published chart with:
#   helm install firecrawl oci://ghcr.io/jo-hoe/charts/firecrawl-mcp --version <x.y.z>
on:
  push:
    tags:
      - 'v*.*.*'

# Serialize releases so concurrent tag pushes don't race.
concurrency:
  group: chart-release
  cancel-in-progress: false

env:
  # OCI registry namespace the chart is pushed to (chart name is appended).
  CHART_REGISTRY: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  release:
    name: Package & Push Chart (OCI)
    runs-on: ubuntu-latest
    permissions:
      # write needed so the helm-docs step can commit the regenerated README.
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Check out the default branch (not the detached tag) so the
          # regenerated docs can be committed and pushed back.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Lint chart
        run: helm lint charts/firecrawl-mcp --strict

      - name: Generate & commit helm-docs
        # Regenerate the chart README with the same tool `make generate-helm-docs`
        # uses, and commit it back to the default branch if it changed, so the
        # published docs always match values.yaml. No-op when already current.
        run: |
          docker run --rm --volume "$PWD/charts/firecrawl-mcp:/helm-docs" jnorwood/helm-docs:latest
          if git diff --quiet -- charts/firecrawl-mcp/README.md; then
            echo "Chart README already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add charts/firecrawl-mcp/README.md
            git commit -m "docs: regenerate chart README for ${GITHUB_REF_NAME} [skip ci]"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi

      - name: Log in to GHCR (Helm registry)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Package chart
        run: helm package charts/firecrawl-mcp --destination ./.cr-release-packages

      - name: Push chart to GHCR
        run: |
          for pkg in ./.cr-release-packages/*.tgz; do
            echo "Pushing $pkg to ${CHART_REGISTRY}"
            helm push "$pkg" "${CHART_REGISTRY}"
          done
