name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Firesearch git ref the image is built from during CI checks.
  FIRESEARCH_REF: main

jobs:
  # ── Lint the Helm chart ────────────────────────────────────────────────────
  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Lint chart
        run: helm lint charts/firesearch --strict

      - name: Template chart (render sanity check)
        run: |
          helm template firesearch charts/firesearch \
            --set-string secrets.openaiApiKey=test \
            --set-string secrets.firecrawlApiKey=test > /dev/null

  # ── Build the container image (integration check) ──────────────────────────
  # This repo holds no app source; the Dockerfile clones Firesearch at build
  # time. Building the image is therefore the real integration test — it
  # exercises the clone, the standalone-output injection, and the pnpm build.
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          build-args: |
            FIRESEARCH_REF=${{ env.FIRESEARCH_REF }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Build & publish the container image ────────────────────────────────────
  docker-publish:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: [helm-lint, docker-build]
    # Only publish on version tags.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            FIRESEARCH_REF=${{ env.FIRESEARCH_REF }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
