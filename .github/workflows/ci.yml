name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

jobs:
  # ── Lint & render the Helm chart ───────────────────────────────────────────
  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Lint chart
        run: helm lint charts/firecrawl-mcp --strict

      - name: Template chart with production defaults (render sanity check)
        run: helm template firecrawl charts/firecrawl-mcp > /dev/null

      - name: Template chart with minimal-footprint values (render sanity check)
        run: |
          helm template firecrawl charts/firecrawl-mcp \
            -f charts/firecrawl-mcp/values-minimal.yaml > /dev/null

      - name: Verify helm-docs are up to date
        # Fails the build if charts/firecrawl-mcp/README.md doesn't match what
        # `make generate-helm-docs` produces. Run that target and commit to fix.
        run: |
          docker run --rm --volume "$PWD/charts/firecrawl-mcp:/helm-docs" jnorwood/helm-docs:latest
          if ! git diff --exit-code -- charts/firecrawl-mcp/README.md; then
            echo "::error::charts/firecrawl-mcp/README.md is out of date. Run 'make generate-helm-docs' and commit the result." >&2
            exit 1
          fi
