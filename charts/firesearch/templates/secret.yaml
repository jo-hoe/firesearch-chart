{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "firesearch.fullname" . }}
  labels:
    {{- include "firesearch.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENAI_API_KEY: {{ required "secrets.openaiApiKey is required when secrets.existingSecret is not set" .Values.secrets.openaiApiKey | quote }}
  OPENAI_BASE_URL: {{ .Values.secrets.openaiBaseUrl | quote }}
  FIRECRAWL_API_KEY: {{ required "secrets.firecrawlApiKey is required when secrets.existingSecret is not set" .Values.secrets.firecrawlApiKey | quote }}
{{- end }}
