apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "firesearch.fullname" . }}-test-connection"
  labels:
    {{- include "firesearch.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.36
      command: ["wget"]
      args:
        - "--spider"
        - "--timeout=10"
        - "{{ include "firesearch.fullname" . }}:{{ .Values.service.port }}"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65534
        capabilities:
          drop:
            - ALL
