# Default values for the firesearch chart.
# This is a YAML-formatted file. Values are consumed by the templates under templates/.

# Number of application replicas. Firesearch is stateless, so it scales horizontally.
replicaCount: 1

# Number of old ReplicaSets to retain for rollback.
revisionHistoryLimit: 3

image:
  repository: ghcr.io/firecrawl/firesearch
  # The Firesearch release version to deploy. This is the image tag; the image
  # is built from the matching Firesearch git ref (see Dockerfile FIRESEARCH_REF).
  # Defaults to the chart appVersion when left empty.
  tag: ""
  pullPolicy: IfNotPresent

# Secrets for pulling the image from a private registry, e.g.:
#   imagePullSecrets:
#     - name: ghcr-credentials
imagePullSecrets: []

# Partially override the fullname of resources created by this chart.
nameOverride: ""
fullnameOverride: ""

# ─── Application configuration ───────────────────────────────────────────────
# API keys are rendered into a Secret (templates/secret.yaml) and injected into
# the container as environment variables via secretKeyRef.
#
# SECURITY: Do not commit real secrets. Prefer one of:
#   1. helm install ... --set-string secrets.openaiApiKey=...  (never in a values file in git)
#   2. secrets.existingSecret: <name>  to reference a Secret you manage out-of-band.
secrets:
  # If set, the chart will NOT create a Secret and will instead read keys from
  # this pre-existing Secret. It must contain the keys: OPENAI_API_KEY,
  # OPENAI_BASE_URL, FIRECRAWL_API_KEY.
  existingSecret: ""

  # Values used only when existingSecret is empty.
  openaiApiKey: ""
  # OpenAI-compatible endpoint. Leave empty to use OpenAI's default.
  openaiBaseUrl: ""
  firecrawlApiKey: ""

# Non-sensitive environment variables passed verbatim to the container.
#   env:
#     - name: SOME_FLAG
#       value: "true"
env: []

# ─── Workload configuration ──────────────────────────────────────────────────
service:
  type: ClusterIP
  port: 80
  # Container port exposed by the Next.js standalone server.
  targetPort: 3000

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

# Liveness/readiness probes hit the app's root path.
livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20
readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

# Pod- and container-level security contexts. Aligned with the non-root image.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
# Extra labels applied to pods (merged with the standard selector labels).
podLabels: {}

serviceAccount:
  # Whether to create a dedicated ServiceAccount.
  create: true
  # Name to use; generated from the fullname template if empty.
  name: ""
  # Firesearch does not talk to the Kubernetes API, so its token is not mounted.
  automount: false
  annotations: {}

# ─── Ingress ─────────────────────────────────────────────────────────────────
# Disabled by default. Enable and configure host/TLS for external access.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: firesearch.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: firesearch-tls
  #    hosts:
  #      - firesearch.example.com
