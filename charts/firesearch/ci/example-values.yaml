# Local override for `helm install --values`. NOT for committing real secrets.
# Copy to my-values.yaml, fill in, and pass with -f my-values.yaml.
secrets:
  openaiApiKey: "sk-..."
  openaiBaseUrl: ""
  firecrawlApiKey: "fc-..."

ingress:
  enabled: true
  className: traefik
  hosts:
    - host: firesearch.local
      paths:
        - path: /
          pathType: Prefix
