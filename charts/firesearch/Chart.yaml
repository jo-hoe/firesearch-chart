apiVersion: v2
name: firesearch
description: A Helm chart for Firesearch — a self-hosted, Firecrawl-powered deep research app built on Next.js 15.
type: application

# Chart version. Bumped on every packaging change to the chart.
version: 0.1.0

# Version of the Firesearch application deployed by this chart.
# Matches the default image tag in values.yaml.
appVersion: "1.0.0"

home: https://github.com/firecrawl/firesearch
sources:
  - https://github.com/firecrawl/firesearch
keywords:
  - firesearch
  - firecrawl
  - search
  - nextjs
maintainers:
  - name: firesearch-chart
