apiVersion: v2
name: firesearch
description: An unofficial Helm chart for deploying Firesearch, a self-hosted deep research app built on Next.js. Not affiliated with or endorsed by Firecrawl.
type: application

# Chart version. Bumped on every packaging change to the chart.
version: 0.2.0

# Version of the Firesearch application deployed by this chart.
# The image is built from Firesearch's main branch and tagged with this chart's
# release version, so appVersion tracks the chart release (see values.yaml
# image.tag, which defaults to this).
appVersion: "0.2.0"

home: https://github.com/jo-hoe/firesearch-chart
sources:
  - https://github.com/jo-hoe/firesearch-chart
keywords:
  - firesearch
  - search
  - nextjs
maintainers:
  - name: jo-hoe
    url: https://github.com/jo-hoe
