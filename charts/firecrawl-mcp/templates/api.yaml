apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "firecrawl-mcp.componentName" (list . "api") }}
  labels:
    {{- include "firecrawl-mcp.componentLabels" (list . "api") | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "firecrawl-mcp.selectorLabels" (list . "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "firecrawl-mcp.selectorLabels" (list . "api") | nindent 8 }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 180
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          command: ["node"]
          args: ["--max-old-space-size={{ .Values.api.maxOldSpaceSizeMb }}", "dist/src/index.js"]
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          env:
            - name: FLY_PROCESS_GROUP
              value: "app"
            - name: NUQ_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - configMapRef:
                name: {{ include "firecrawl-mcp.configName" . }}
            - secretRef:
                name: {{ include "firecrawl-mcp.secretName" . }}
          {{- if .Values.resources.enabled }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /v0/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /v0/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "firecrawl-mcp.componentName" (list . "api") }}
  labels:
    {{- include "firecrawl-mcp.componentLabels" (list . "api") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "firecrawl-mcp.selectorLabels" (list . "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
