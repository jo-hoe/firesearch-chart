apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "firecrawl-mcp.componentName" (list . "worker") }}
  labels:
    {{- include "firecrawl-mcp.componentLabels" (list . "worker") | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "firecrawl-mcp.selectorLabels" (list . "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "firecrawl-mcp.selectorLabels" (list . "worker") | nindent 8 }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          command: ["node"]
          args: ["--max-old-space-size={{ .Values.worker.maxOldSpaceSizeMb }}", "dist/src/services/queue-worker.js"]
          ports:
            - name: http
              containerPort: {{ .Values.worker.port }}
          env:
            - name: FLY_PROCESS_GROUP
              value: "worker"
            - name: WORKER_PORT
              value: {{ .Values.worker.port | quote }}
            - name: NUQ_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - configMapRef:
                name: {{ include "firecrawl-mcp.configName" . }}
            - secretRef:
                name: {{ include "firecrawl-mcp.secretName" . }}
          {{- if .Values.resources.enabled }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /liveness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
