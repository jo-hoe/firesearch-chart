{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "firecrawl-mcp.secretName" . }}
  labels:
    {{- include "firecrawl-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword is required (or set secrets.existingSecret)" .Values.secrets.postgresPassword | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
{{- end }}
