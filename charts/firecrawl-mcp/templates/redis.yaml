apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "firecrawl-mcp.componentName" (list . "redis") }}
  labels:
    {{- include "firecrawl-mcp.componentLabels" (list . "redis") | nindent 4 }}
spec:
  replicas: {{ .Values.redis.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "firecrawl-mcp.selectorLabels" (list . "redis") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "firecrawl-mcp.selectorLabels" (list . "redis") | nindent 8 }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "firecrawl-mcp.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      securityContext:
        {{- include "firecrawl-mcp.podSecurityContext" (list .) | nindent 8 }}
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          securityContext:
            {{- include "firecrawl-mcp.containerSecurityContext" (list . .Values.redis.containerSecurityContext) | nindent 12 }}
          command: ["redis-server", "--bind", "0.0.0.0"]
          ports:
            - name: redis
              containerPort: {{ .Values.redis.port }}
          {{- if .Values.resources.enabled }}
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          {{- end }}
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "firecrawl-mcp.componentName" (list . "redis") }}
  labels:
    {{- include "firecrawl-mcp.componentLabels" (list . "redis") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "firecrawl-mcp.selectorLabels" (list . "redis") | nindent 4 }}
  ports:
    - name: redis
      port: {{ .Values.redis.port }}
      targetPort: redis
