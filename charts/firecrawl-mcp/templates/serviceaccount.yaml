{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "firecrawl-mcp.serviceAccountName" . }}
  labels:
    {{- include "firecrawl-mcp.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# None of the chart's pods talk to the Kubernetes API, so the token is not
# mounted by default. Set serviceAccount.automountServiceAccountToken: true only
# if you add a component that needs API access.
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
