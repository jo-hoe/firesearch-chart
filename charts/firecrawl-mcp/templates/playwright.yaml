apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "firecrawl-mcp.componentName" (list . "playwright") }}
  labels:
    {{- include "firecrawl-mcp.componentLabels" (list . "playwright") | nindent 4 }}
spec:
  replicas: {{ .Values.playwright.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "firecrawl-mcp.selectorLabels" (list . "playwright") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "firecrawl-mcp.selectorLabels" (list . "playwright") | nindent 8 }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "firecrawl-mcp.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      securityContext:
        {{- include "firecrawl-mcp.podSecurityContext" (list .) | nindent 8 }}
      containers:
        - name: playwright
          image: "{{ .Values.playwright.image.repository }}:{{ .Values.playwright.image.tag }}"
          imagePullPolicy: {{ .Values.playwright.image.pullPolicy }}
          securityContext:
            {{- include "firecrawl-mcp.containerSecurityContext" (list . .Values.playwright.containerSecurityContext) | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.playwright.port }}
          env:
            - name: PORT
              value: {{ .Values.playwright.port | quote }}
            - name: BLOCK_MEDIA
              value: {{ .Values.playwright.blockMedia | quote }}
            - name: MAX_CONCURRENT_PAGES
              value: "10"
          {{- if .Values.resources.enabled }}
          resources:
            {{- toYaml .Values.playwright.resources | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "firecrawl-mcp.componentName" (list . "playwright") }}
  labels:
    {{- include "firecrawl-mcp.componentLabels" (list . "playwright") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "firecrawl-mcp.selectorLabels" (list . "playwright") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.playwright.port }}
      targetPort: http
