# Default values for the firecrawl-mcp chart.
#
# This chart deploys a fully self-hosted Firecrawl backend plus the Firecrawl
# MCP server, so an MCP client (e.g. Claude Code) can reach Firecrawl over HTTP
# with no external API keys.
#
# ─── SCALING ──────────────────────────────────────────────────────────────────
# Defaults mirror upstream Firecrawl's PRODUCTION sizing (multiple workers,
# multi-GB pods). This needs a real cluster (~20GB+ RAM). To run on a laptop /
# k3d / homelab, install with the bundled minimal overrides:
#   helm install firecrawl-mcp charts/firecrawl-mcp -f charts/firecrawl-mcp/values-minimal.yaml
# ──────────────────────────────────────────────────────────────────────────────

# -- Override the chart name portion of resource names.
nameOverride: ""
# -- Override the full name of resources (replaces the release-name prefix).
fullnameOverride: ""

# -- Number of old ReplicaSets to retain for rollback (applies to all Deployments).
revisionHistoryLimit: 3

# -- Image pull secrets applied to every pod.
imagePullSecrets: []

# ─── ServiceAccount ─────────────────────────────────────────────────────────────
serviceAccount:
  # -- Create a dedicated ServiceAccount for the chart's pods (recommended, so
  # they don't run under the namespace `default` account).
  create: true
  # -- Name of the ServiceAccount. Defaults to the chart fullname when empty.
  name: ""
  # -- Annotations for the ServiceAccount (e.g. IRSA / Workload Identity roles).
  annotations: {}
  # -- Mount the SA token into pods. OFF by default because no component talks to
  # the Kubernetes API; turn on only if you add one that does.
  automountServiceAccountToken: false

resources:
  # -- Master switch for applying the per-component `resources` blocks. Set false
  # to let pods run without requests/limits (handy for quick local experiments).
  enabled: true

# ─── Firecrawl API ────────────────────────────────────────────────────────────
api:
  # -- Number of Firecrawl API replicas.
  replicaCount: 1
  image:
    # -- Firecrawl API image repository (also used by the workers).
    repository: ghcr.io/firecrawl/firecrawl
    # -- Firecrawl API image tag.
    tag: "latest"
    # -- Firecrawl API image pull policy.
    pullPolicy: IfNotPresent
  # -- Container port the API listens on.
  port: 3002
  # -- Node heap ceiling for the API in MB (passed to Node's max-old-space-size; keep below the memory limit).
  maxOldSpaceSizeMb: 6144
  # -- CPU/memory requests and limits for the API pod.
  resources:
    requests:
      memory: "4Gi"
      cpu: "2000m"
    limits:
      memory: "6Gi"
      cpu: "2000m"
  # -- Per-component container securityContext override (merged over the
  # chart-wide containerSecurityContext).
  containerSecurityContext: {}
  # -- PodDisruptionBudget for the API. Only rendered when replicaCount > 1.
  pdb:
    enabled: true
    maxUnavailable: 1
    # minAvailable: 1  # takes precedence over maxUnavailable when set

# ─── Queue worker ─────────────────────────────────────────────────────────────
worker:
  # -- Number of queue-worker replicas.
  replicaCount: 1
  # -- Container port the queue worker exposes for health checks.
  port: 3005
  # -- Node heap ceiling for the queue worker (MB).
  maxOldSpaceSizeMb: 3072
  # -- CPU/memory requests and limits for the queue-worker pod.
  resources:
    requests:
      memory: "3Gi"
      cpu: "1000m"
    limits:
      memory: "4Gi"
      cpu: "1000m"
  # -- Per-component container securityContext override.
  containerSecurityContext: {}

# ─── NuQ workers (the primary scrape/crawl workers) ───────────────────────────
nuqWorker:
  # -- Number of NuQ worker replicas (the primary scrape/crawl workers). Raise
  # for more scrape throughput.
  replicaCount: 5
  # -- Container port the NuQ worker exposes for health checks.
  port: 3006
  # -- Node heap ceiling for each NuQ worker (MB).
  maxOldSpaceSizeMb: 3072
  # -- CPU/memory requests and limits per NuQ worker pod.
  resources:
    requests:
      memory: "3Gi"
      cpu: "1000m"
    limits:
      memory: "4Gi"
      cpu: "1000m"
  # -- Per-component container securityContext override.
  containerSecurityContext: {}

# ─── Playwright scraping microservice ─────────────────────────────────────────
playwright:
  # -- Number of Playwright microservice replicas.
  replicaCount: 1
  image:
    # -- Playwright service image repository.
    repository: ghcr.io/firecrawl/playwright-service
    # -- Playwright service image tag.
    tag: "latest"
    # -- Playwright service image pull policy.
    pullPolicy: IfNotPresent
  # -- Container port the Playwright service listens on.
  port: 3000
  # -- Block images/media to save bandwidth and memory during scraping.
  blockMedia: true
  # -- CPU/memory requests and limits for the Playwright pod.
  resources:
    requests:
      memory: "2Gi"
      cpu: "1000m"
    limits:
      memory: "4Gi"
      cpu: "2000m"
  # -- Per-component container securityContext override.
  containerSecurityContext: {}

# ─── Redis ────────────────────────────────────────────────────────────────────
redis:
  # -- Number of Redis replicas (should remain 1; not clustered).
  replicaCount: 1
  image:
    # -- Redis image repository.
    repository: redis
    # -- Redis image tag.
    tag: "alpine"
    # -- Redis image pull policy.
    pullPolicy: IfNotPresent
  # -- Container port Redis listens on.
  port: 6379
  # -- CPU/memory requests and limits for the Redis pod.
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  # -- Per-component container securityContext override.
  containerSecurityContext: {}

# ─── RabbitMQ (NuQ message broker) ────────────────────────────────────────────
rabbitmq:
  # -- Number of RabbitMQ replicas (should remain 1; not clustered).
  replicaCount: 1
  image:
    # -- RabbitMQ image repository.
    repository: rabbitmq
    # -- RabbitMQ image tag.
    tag: "3-management"
    # -- RabbitMQ image pull policy.
    pullPolicy: IfNotPresent
  # -- Container port RabbitMQ listens on (AMQP).
  port: 5672
  # -- CPU/memory requests and limits for the RabbitMQ pod.
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  # -- Per-component container securityContext override.
  containerSecurityContext: {}

# ─── NuQ PostgreSQL (queue backend) ───────────────────────────────────────────
nuqPostgres:
  # -- Number of NuQ Postgres replicas (should remain 1).
  replicaCount: 1
  image:
    # -- NuQ Postgres image repository (Postgres + pg_cron).
    repository: ghcr.io/firecrawl/nuq-postgres
    # -- NuQ Postgres image tag.
    tag: "latest"
    # -- NuQ Postgres image pull policy.
    pullPolicy: IfNotPresent
  # -- Container port Postgres listens on.
  port: 5432
  auth:
    # -- Postgres username used in the composed NUQ_DATABASE_URL.
    username: postgres
    # -- Postgres password. Overridden by secrets.postgresPassword (or an
    # existingSecret); this non-secret default is for local use only — set a
    # real password in production.
    password: postgres
    # -- Postgres database name.
    database: postgres
  # -- Persistence for the NuQ Postgres data. OFF BY DEFAULT: queue state (and
  # any crawl results held in Postgres) is LOST when the pod is replaced. Enable
  # for anything you care about surviving restarts.
  persistence:
    enabled: false
    size: 10Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce
  # -- CPU/memory requests and limits for the Postgres pod.
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  # -- Per-component container securityContext override, merged over the
  # chart-wide default. The Postgres image normally starts as root to chown its
  # data dir, which the hardened default (drop ALL caps, no privilege
  # escalation) forbids. Instead we run directly as the postgres user (UID 999)
  # and rely on podSecurityContext.fsGroup below to make the volume writable.
  containerSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
  # -- Pod-level securityContext for Postgres, merged over the chart-wide
  # podSecurityContext. fsGroup 999 makes the mounted data volume group-writable
  # by the postgres user so no startup chown is needed.
  podSecurityContext:
    fsGroup: 999
    fsGroupChangePolicy: OnRootMismatch

# ─── Firecrawl MCP server (the externally-reachable endpoint) ─────────────────
mcp:
  # -- Number of MCP server replicas.
  replicaCount: 1
  image:
    # -- MCP server image repository.
    repository: ghcr.io/firecrawl/firecrawl-mcp-server
    # -- MCP server image tag.
    tag: "latest"
    # -- MCP server image pull policy.
    pullPolicy: IfNotPresent
  # -- Container port the MCP image serves HTTP (NGINX + FastMCP) on.
  port: 8080
  # -- Mount emptyDir volumes over the bundled nginx's writable paths
  # (/var/lib/nginx/tmp, /var/log/nginx, /run/nginx) so it works under the
  # hardened securityContext without a writable root filesystem.
  nginxWritableVolumes: true
  # -- Public MCP path the FastMCP server and nginx serve. MCP clients connect to
  # `<ingress-host><endpoint>`. Keep in sync with any Ingress paths.
  endpoint: /v2/mcp
  service:
    # -- MCP Service type.
    type: ClusterIP
    # -- MCP Service port.
    port: 80
  # -- CPU/memory requests and limits for the MCP server pod.
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  # -- Per-component container securityContext override, merged over the
  # chart-wide default. The bundled nginx starts as root and drops to its own
  # worker user, so it needs a few capabilities back (the chart-wide default
  # drops ALL). It still cannot escalate privileges and has no writable root fs.
  containerSecurityContext:
    capabilities:
      drop:
        - ALL
      add:
        - CHOWN
        - SETUID
        - SETGID
        - DAC_OVERRIDE
        - FOWNER
  # -- Pod-level securityContext for the MCP server, merged over the chart-wide
  # podSecurityContext. fsGroup 101 = the image's nginx group, so the emptyDir
  # volumes mounted over nginx's writable paths are group-writable.
  podSecurityContext:
    fsGroup: 101
  # -- PodDisruptionBudget for the MCP server. Only rendered when replicaCount > 1.
  pdb:
    enabled: true
    maxUnavailable: 1
    # minAvailable: 1  # takes precedence over maxUnavailable when set
  # -- Ingress for the MCP server — the ONLY externally-exposed component.
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: firecrawl-mcp.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
    #  - secretName: firecrawl-mcp-tls
    #    hosts:
    #      - firecrawl-mcp.example.com

# ─── Shared Firecrawl configuration (rendered into a ConfigMap) ────────────────
# Connection URLs (Redis, Playwright, Postgres, RabbitMQ, API) are computed
# automatically from the release name — do not set them here unless overriding.
config:
  # -- When false the self-hosted API is UNAUTHENTICATED. Do NOT expose the API
  # outside a trusted network without adding real authentication first.
  useDbAuthentication: false
  # -- Firecrawl log level (e.g. DEBUG, INFO, WARN, ERROR).
  loggingLevel: "INFO"
  # -- Number of concurrent workers per queue.
  numWorkersPerQueue: 8
  # -- OpenAI-compatible base URL enabling AI features (summary / JSON
  # extraction). Only active when set AND secrets.openaiApiKey is provided.
  # Firecrawl uses the OpenAI *Responses API* (/responses), so the endpoint and
  # chosen model must support it.
  openaiBaseUrl: ""
  # -- Chat model used for summary/extraction. Override to match your endpoint.
  modelName: "gpt-4o-mini"
  # -- Embedding model (only needed by features that embed text).
  modelEmbeddingName: "text-embedding-3-small"
  # -- Ollama base URL, as an alternative to an OpenAI-compatible endpoint.
  ollamaBaseUrl: ""
  # -- Arbitrary extra key/value pairs merged into the ConfigMap.
  extra: {}

# ─── Helm test settings ─────────────────────────────────────────────────────
tests:
  # -- URL the `helm test` connection pod scrapes end-to-end to prove the full
  # backend pipeline (API → queue → worker → playwright) returns markdown.
  scrapeUrl: "https://example.com"
  # -- Max seconds the test waits for the synchronous scrape to complete.
  scrapeTimeoutSeconds: 120

# ─── Secrets ──────────────────────────────────────────────────────────────────
secrets:
  # -- If set, the chart will NOT create a Secret and reads credentials from this
  # pre-existing Secret. It must contain keys: POSTGRES_PASSWORD, OPENAI_API_KEY.
  existingSecret: ""
  # -- Password for the bundled NuQ PostgreSQL. Must match nuqPostgres.auth.password.
  postgresPassword: "postgres"
  # -- OpenAI(-compatible) API key. Only needed to enable AI features.
  openaiApiKey: ""

# ─── Pod scheduling / security (applied to all Deployments) ───────────────────
# -- Annotations added to every pod.
podAnnotations: {}
# -- Labels added to every pod.
podLabels: {}
# -- Node selector for all pods.
nodeSelector: {}
# -- Tolerations for all pods.
tolerations: []
# -- Affinity rules for all pods.
affinity: {}

# -- Pod-level security context, applied to every Deployment. `runAsNonRoot` is
# left unset here because some upstream images (Playwright, the MCP nginx image)
# still start as root; enable it per component via its containerSecurityContext
# once you've confirmed the image supports it. seccomp is enabled cluster-wide.
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

# -- Chart-wide container security context, merged into every workload container.
# These are the restricted-baseline hardening defaults. Per-component overrides
# (e.g. api.containerSecurityContext) are merged on top and win on conflict.
containerSecurityContext:
  allowPrivilegeEscalation: false
  privileged: false
  capabilities:
    drop:
      - ALL
  # readOnlyRootFilesystem is left off: Firecrawl/Playwright/Postgres images
  # write outside mounted volumes. Enable per component after adding writable
  # emptyDir mounts for the paths that image needs.
  readOnlyRootFilesystem: false

# ─── NetworkPolicy ──────────────────────────────────────────────────────────────
networkPolicy:
  # -- Restrict pod-to-pod traffic: datastores and internal services accept
  # ingress only from this release; the MCP server is the sole entry point.
  # Requires a CNI that enforces NetworkPolicy (Calico/Cilium/etc.).
  enabled: true
  # -- Optional namespaceSelector limiting who may reach the MCP server (e.g. the
  # ingress-controller namespace). Empty means any namespace.
  mcpIngressNamespaceSelector: {}
  # -- Also apply a default-deny egress policy (DNS + intra-release only). Leave
  # false unless your workers never scrape arbitrary internet hosts.
  denyEgress: false
